[project]
name = "vast-ai-hashcat-helpers"
version = "0.1.0"
description = "Provision Vast.ai GPUs and run remote hashcat jobs from your host"
requires-python = ">=3.12"
dependencies = [
    "vastai>=1.0",
    "paramiko>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
]

[project.scripts]
provision_worker = "remote_hashcat.provision_cli:main"
remote_hashcat = "remote_hashcat.run_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_hashcat"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
